name: Bug report
description: Report a reproducible problem in Photo Viewer.
body:
  - type: input
    id: version
    attributes:
      label: Photo Viewer version
  - type: input
    id: windows
    attributes:
      label: Windows 11 build
  - type: textarea
    id: details
    attributes:
      label: Steps to reproduce
      description: Include the expected result, actual result, and a sample image if possible.
    validations:
      required: true
